<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#45120B"/>
      <stop offset="65%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </radialGradient>
    <linearGradient id="earthOcean" x1="140" y1="150" x2="370" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E6B7B"/>
      <stop offset="50%" stop-color="#113F52"/>
      <stop offset="100%" stop-color="#0A2233"/>
    </linearGradient>
    <linearGradient id="lavaCrack" x1="256" y1="140" x2="256" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="160" x2="0" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Скруглённый тёмный корпус иконки -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" stroke="#EF4444" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Верхний заголовок TREMOR -->
  <text
    x="256"
    y="112"
    text-anchor="middle"
    fill="#FFFFFF"
    stroke="#EF4444"
    stroke-width="3"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="68"
    letter-spacing="4"
    filter="url(#neonRed)"
  >TREMOR</text>

  <!-- Земной шар -->
  <circle cx="256" cy="264" r="112" fill="url(#earthOcean)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Континенты (стилизованные зелёные очертания) -->
  <path d="M175 215C192 195 215 190 228 205C236 218 220 245 205 262C195 274 208 296 198 320C188 338 170 315 162 285C154 255 162 230 175 215Z" fill="#22C55E" fill-opacity="0.55"/>
  <path d="M292 190C315 186 342 204 348 232C354 260 335 280 322 305C312 325 296 310 292 285C288 260 278 215 292 190Z" fill="#22C55E" fill-opacity="0.55"/>

  <!-- Сейсмические дуги-волны слева -->
  <path d="M188 210 A 82 82 0 0 0 188 318" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round" filter="url(#neonRed)"/>
  <path d="M158 190 A 112 112 0 0 0 158 338" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" filter="url(#neonRed)"/>
  <path d="M126 168 A 146 146 0 0 0 126 360" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" filter="url(#neonRed)"/>
  <path d="M94 148 A 180 180 0 0 0 94 380" stroke="#EF4444" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Сейсмические дуги-волны справа -->
  <path d="M324 210 A 82 82 0 0 1 324 318" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round" filter="url(#neonRed)"/>
  <path d="M354 190 A 112 112 0 0 1 354 338" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" filter="url(#neonRed)"/>
  <path d="M386 168 A 146 146 0 0 1 386 360" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" filter="url(#neonRed)"/>
  <path d="M418 148 A 180 180 0 0 1 418 380" stroke="#EF4444" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Разлом Земли по центру -->
  <path
    d="M258 148L232 204L266 232L224 282L258 310L248 368L278 304L248 276L286 226L252 198L272 150Z"
    fill="url(#lavaCrack)"
    stroke="#FDE047"
    stroke-width="2.5"
    filter="url(#neonRed)"
  />

  <!-- Иконка клика пальцем и кнопка SOS внизу -->
  <circle cx="242" cy="366" r="18" stroke="#FFFFFF" stroke-width="5" fill="#EF4444" filter="url(#neonRed)"/>
  <path d="M242 366L256 410L288 402" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Нижний текст SOS -->
  <text
    x="256"
    y="468"
    text-anchor="middle"
    fill="#FFFFFF"
    stroke="#EF4444"
    stroke-width="3"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="76"
    letter-spacing="6"
    filter="url(#neonRed)"
  >SOS</text>
</svg>
